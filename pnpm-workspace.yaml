packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  "@prisma/engines": true
  prisma: true
  esbuild: true
  "@swc/core": true
  '@prisma/client': true
  better-sqlite3: true
  '@mongodb-js/zstd': true
  node-liblzma: true

# Security overrides — same-major bumps over vulnerable transitive ranges
# (2026-07 advisories; see pnpm audit). Range-scoped so unrelated major
# lines (e.g. brace-expansion@1.x consumers) stay untouched.
overrides:
  '@xmldom/xmldom@>=0.7.0 <=0.8.14': 0.8.15
  'baseline-browser-mapping@>=2.0.0 <2.11.0': 2.11.24
  'better-auth@>=1.5.0 <1.7.5': 1.7.5
  'browserslist@<=4.28.6': 4.29.0
  'deepmerge-ts@<8.0.0': 8.0.2
  'drizzle-orm@<0.45.2': 0.45.2
  'fast-uri@>=3.0.0 <3.1.6': 3.1.6
  'hono@<4.13.5': 4.13.8
  'js-yaml@<4.3.2': ^4.3.2
  'multer@<2.3.0': 2.4.0
  'mysql2@<=3.23.0': 3.24.4
  'qs@<6.16.0': 6.16.0
  'vitest@>=2.1.0 <4.1.11': 4.1.11
  'nanoid@<3.3.18': ^3.3.18
  'postcss@<8.5.23': ^8.5.26
  'brace-expansion@>=5.0.0 <5.0.9': 5.0.9

minimumReleaseAgeExclude:
  - "@ai-sdk/*"
  - "@rolldown/*"
  - "@vercel/*"
  - "@workflow/*"
  - ai
  - experimental-ai-sdk-code-mode
  - eve
  - nitro
  - rolldown
  - workflow
  - baseline-browser-mapping@2.11.24
  - hono@4.13.8
  - browserslist@4.29.0

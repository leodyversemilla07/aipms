name: Publish Docker images

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push API image
      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aipms-api:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64

      # Build and push Web image
      - name: Build & push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: web
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aipms-web:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64

      # Build and push Agent image
      - name: Build & push Agent image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: agent
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/aipms-agent:${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64

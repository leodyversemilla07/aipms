services:
  postgres:
    image: postgres:17-alpine
    container_name: aipms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: aipms
    ports:
      - "5432:5432"
    volumes:
      - aipms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d aipms"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  aipms-postgres:
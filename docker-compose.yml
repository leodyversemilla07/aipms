# Single-tenant AIPMS deployment.
#
#   docker compose up -d --build
#
# Boot order: postgres (healthy) → api (migrate-on-deploy, then healthy) →
# web + agent. Upgrading to a new schema is the same command: the api
# entrypoint applies pending migrations (`prisma migrate deploy`) on start.
#
# All secrets/variables are overridable via a root .env file (see .env.example):
#   BETTER_AUTH_SECRET, AIPMS_SERVICE_TOKEN, POSTGRES_*, APP_URL, WEB_PORT, ...
name: aipms

services:
  postgres:
    image: postgres:17-alpine
    container_name: aipms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-aipms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aipms-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-aipms}"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      target: api
    container_name: aipms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-aipms}
      PORT: 3001
      NODE_ENV: production
      # Browser-facing origin of the web app (auth cookies) — override in .env
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Internal origin of the auth endpoints (the web app proxies /api/auth here)
      API_URL: http://api:3001
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      # Generate with: openssl rand -base64 32 — required in production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me}
      AIPMS_SERVICE_TOKEN: ${AIPMS_SERVICE_TOKEN:-}
      # maker@/checker@demo.aipms demo identities (non-production)
      AUTH_SEED_DEMO: ${AUTH_SEED_DEMO:-0}
      # Agent drain loop (intake → classify → match) — off by default
      AGENT_AUTORUN: ${AGENT_AUTORUN:-0}
      AGENT_INTERVAL_MS: ${AGENT_INTERVAL_MS:-60000}
      AGENT_BATCH_SIZE: ${AGENT_BATCH_SIZE:-25}
      EVENT_RELAY_INTERVAL_MS: ${EVENT_RELAY_INTERVAL_MS:-1000}
      EVENT_RELAY_MAX_ATTEMPTS: ${EVENT_RELAY_MAX_ATTEMPTS:-5}
      # §8.2 email intake (optional): set host/user/password in .env to poll
      # the org's supplier mailbox and feed the normalized intake queue.
      AIPMS_IMAP_HOST: ${AIPMS_IMAP_HOST:-}
      AIPMS_IMAP_PORT: ${AIPMS_IMAP_PORT:-993}
      AIPMS_IMAP_USER: ${AIPMS_IMAP_USER:-}
      AIPMS_IMAP_PASSWORD: ${AIPMS_IMAP_PASSWORD:-}
      AIPMS_IMAP_TLS: ${AIPMS_IMAP_TLS:-true}
      AIPMS_IMAP_MAILBOX: ${AIPMS_IMAP_MAILBOX:-INBOX}
      AIPMS_IMAP_INTERVAL_MS: ${AIPMS_IMAP_INTERVAL_MS:-60000}
      # §8.6 pain.001 debtor (paying org) — set both to enable the ISO 20022 rail
      AIPMS_PAYMENT_DEBTOR_NAME: ${AIPMS_PAYMENT_DEBTOR_NAME:-}
      AIPMS_PAYMENT_DEBTOR_ACCOUNT: ${AIPMS_PAYMENT_DEBTOR_ACCOUNT:-}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      target: web
    container_name: aipms-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://api:3001
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  agent:
    build:
      context: .
      target: agent
    container_name: aipms-agent
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AIPMS_API_URL: http://api:3001
      AIPMS_SERVICE_TOKEN: ${AIPMS_SERVICE_TOKEN:-}
      # LLM provider gate: "cloud" (BYO OpenAI-compatible keys) or "offline"
      # (local zero-egress endpoint). The agent refuses to start when the
      # gate is not satisfied (§16.6).
      AIPMS_LLM_KIND: ${AIPMS_LLM_KIND:-cloud}
      AIPMS_LLM_ENDPOINT: ${AIPMS_LLM_ENDPOINT:-}
      AIPMS_LLM_MODEL: ${AIPMS_LLM_MODEL:-}
      # Cloud key. Dev-only placeholder for local compose; set a real key in
      # production (openssl rand -base64 32).
      AIPMS_LLM_API_KEY: ${AIPMS_LLM_API_KEY:-dev-only-key-change-me}
      # Cloud key fallback (BYO keys).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional provider gate policies: residency, retention, no-retention.
      # residency requires AIPMS_LLM_ALLOWED_HOSTS.
      AIPMS_LLM_GATE: ${AIPMS_LLM_GATE:-}
      AIPMS_LLM_ALLOWED_HOSTS: ${AIPMS_LLM_ALLOWED_HOSTS:-}
      # Custom endpoints bypass the AI Gateway model catalog; set the model's
      # context window (tokens) when compaction is used.
      AIPMS_LLM_CONTEXT_WINDOW: ${AIPMS_LLM_CONTEXT_WINDOW:-}

  # Optional local LLM endpoint for offline/air-gapped deployments. Disabled
  # by default; enable with:
  #   docker compose --profile offline up -d
  #   docker compose --profile offline exec llm ollama pull llama3.2:3b
  # then point the agent at it (e.g. AIPMS_LLM_ENDPOINT=http://llm:11434/v1,
  # AIPMS_LLM_MODEL=llama3.2:3b, AIPMS_LLM_KIND=offline).
  llm:
    image: ollama/ollama:latest
    container_name: aipms-llm
    restart: unless-stopped
    profiles: ["offline"]
    volumes:
      - aipms-ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  aipms-postgres:
  aipms-ollama: